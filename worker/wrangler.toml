name = "wa-templates-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing preset templates JSON
[[kv_namespaces]]
binding = "WA_TEMPLATES_KV"
id = "YOUR_KV_NAMESPACE_ID"

# R2 Bucket for storing MP3 voice over audio files
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "wa-audio-bucket"
public_url = "https://r2.yourdomain.com"
